<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8B5FBF" />
    <meta name="description" content="FitHer AI — โค้ชออกกำลังกาย AI ที่ปรับตามชีวิตจริงของคุณ" />
    <title>FitHer AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint. Without this the app flashes
      // light before switching, which looks broken on a dark phone at night.
      (function () {
        try {
          var m = localStorage.getItem('fither.theme');
          if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
          var a = localStorage.getItem('fither.accent');
          document.documentElement.setAttribute('data-accent', a || 'plum');
        } catch (e) {
          document.documentElement.setAttribute('data-accent', 'plum');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
